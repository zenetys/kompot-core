# Test: Standalone reopen affects host templates declared before AND after
# Reproduces the exact bug reported in production (SCAPARF):
# - host template "os" declared BEFORE the standalone reopen did NOT pick up
#   the override (__CRITICAL=22), while "sw-tplink" declared AFTER did.
#
# Both host templates must use the overridden standalone version.

# System standalone service template
service snmp-uptime --template check_command=check-snmp-uptime __CRITICAL=86400

# Host template declared BEFORE the reopen (was broken: used snmp-uptime instead of snmp-uptime__1)
host os --template
  service UPTIME:snmp-uptime

# User overrides standalone template
service snmp-uptime --template __CRITICAL=22

# Host template declared AFTER the reopen (was working)
host sw-tplink --template
  service UPTIME:snmp-uptime

# Concrete hosts to validate both paths
host ad-dhcp:os --address=10.0.0.1
host switch01:sw-tplink --address=10.0.0.2
