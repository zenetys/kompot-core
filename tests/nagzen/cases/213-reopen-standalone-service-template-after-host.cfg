# Test: Standalone service template reopen AFTER host template declaration
# Validates that reopening a standalone template propagates to host templates
# that were already declared before the reopen.
#
# This is the main bug scenario: system defines template + host template,
# then user overrides the standalone template in a later config file.

# Initial standalone service template (simulates system template)
service my-check --template check_command=check-dummy __WARN=80 __CRIT=95

# Host template declared BEFORE the reopen
host linux --template
  service MY-CHECK:my-check

# Reopen standalone template (simulates user override in /etc/kompot/nagzen/)
service my-check --template __CRIT=22

# Concrete host to validate
host server1:linux --address=10.0.0.1

# ASSERT service:server1:MY-CHECK:__CRIT=22
# ASSERT service:server1:MY-CHECK:__WARN=80
# ASSERT service:server1:MY-CHECK:check_command=check-dummy
