# Test: Reopen standalone service template to override attributes
# Validates that a standalone service template can be reopened to change
# custom variables (e.g., override __CONNECTOR_HOSTNAME for VMware agent).
#
# Use case: System defines template in /opt/kompot/lib/nagzen/400_template_vmware.cfg
# with __CONNECTOR_HOSTNAME='127.0.0.1', user overrides in /etc/kompot/nagzen/
# with __CONNECTOR_HOSTNAME='172.17.0.1'

# Initial standalone service template (simulates system template)
service api-vsphere-auth --template check_command=check-vsphere __CONNECTOR_HOSTNAME='127.0.0.1' __CONNECTOR_PORT='5700'

# Reopen to override connector hostname (simulates user override)
service api-vsphere-auth --template __CONNECTOR_HOSTNAME='172.17.0.1'

# Host template using the service
host vmware --template
  service API-VSPHERE-AUTH:api-vsphere-auth

# Concrete host to validate
host esxi01:vmware --address=10.0.0.1
