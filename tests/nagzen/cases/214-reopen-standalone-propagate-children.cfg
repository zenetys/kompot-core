# Test: Standalone reopen propagates to child host templates
# Validates that reopening a standalone template cascades through
# the host template inheritance chain (parent -> child).

# Initial standalone service template
service my-check --template check_command=check-dummy __CRIT=95

# Parent host template uses the service
host os --template
  service MY-CHECK:my-check

# Child host template inherits from parent
host linux:os --template

# Reopen standalone template AFTER both host templates are declared
service my-check --template __CRIT=22

# Concrete host inheriting from child template
host server1:linux --address=10.0.0.1
