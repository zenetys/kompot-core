# Test: Multiple reopens of standalone service template
# Validates that a standalone service template can be reopened multiple times,
# each override creating a new intermediate template in the inheritance chain.

# Initial definition
service my-check --template check_command=check-dummy __WARN=80 __CRIT=95

# First override
service my-check --template __WARN=70

# Second override
service my-check --template __CRIT=90

# Use it
host linux --template
  service MY-CHECK:my-check

host server1:linux --address=10.0.0.1
