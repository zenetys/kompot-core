# Test: Reopen standalone service template + host template service override
# Validates that a host template can further override a service whose
# standalone template has already been reopened.

# Initial standalone service template
service my-connector --template check_command=check-dummy __HOST='127.0.0.1' __PORT='5700'

# Reopen standalone template to change host
service my-connector --template __HOST='172.17.0.1'

# Host template that further overrides the port
host mydevice --template
  service MY-CONNECTOR:my-connector __PORT='5800'

# Concrete host
host device01:mydevice --address=10.0.0.1
