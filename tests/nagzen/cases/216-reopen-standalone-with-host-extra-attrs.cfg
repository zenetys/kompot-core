# Test: Standalone reopen preserves host template service extra attributes
# Validates that when a standalone template is reopened AFTER a host template
# service was declared with extra attributes (__PORT, __LABEL), the extra
# attributes are re-emitted on the intermediate template so they are not
# lost from the inheritance chain.

# System standalone service template
service my-connector --template check_command=check-dummy __HOST='127.0.0.1' __PORT='5700' __TIMEOUT='30'

# Host template with explicit port override AND extra custom var
host mydevice --template
  service CONNECTOR:my-connector __PORT='5800' __LABEL='primary'

# Child host template that inherits without override
host mydevice-v2:mydevice --template

# User reopens standalone to change default host
service my-connector --template __HOST='172.17.0.1'

# Concrete hosts
host device01:mydevice --address=10.0.0.1
host device02:mydevice-v2 --address=10.0.0.2

# Verify resolved attributes for device01 (direct child of mydevice)
# ASSERT service:device01:CONNECTOR:__HOST=172.17.0.1
# ASSERT service:device01:CONNECTOR:__PORT=5800
# ASSERT service:device01:CONNECTOR:__TIMEOUT=30
# ASSERT service:device01:CONNECTOR:__LABEL=primary
# ASSERT service:device01:CONNECTOR:check_command=check-dummy

# Verify resolved attributes for device02 (grandchild via mydevice-v2)
# ASSERT service:device02:CONNECTOR:__HOST=172.17.0.1
# ASSERT service:device02:CONNECTOR:__PORT=5800
# ASSERT service:device02:CONNECTOR:__TIMEOUT=30
# ASSERT service:device02:CONNECTOR:__LABEL=primary
# ASSERT service:device02:CONNECTOR:check_command=check-dummy
