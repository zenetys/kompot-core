# Test: Standalone reopen with host template service extra attributes
# Validates behavior when a standalone template is reopened AFTER a host
# template service was declared with extra attributes (__PORT, __LABEL).
#
# Known limitation: attributes from the host template service that override
# standalone defaults (__PORT=5800 vs __PORT=5700) are NOT preserved after
# standalone reopen, because the intermediate template chains through the
# new standalone version, bypassing the original host template service.
# Attributes NOT present in the standalone (__LABEL) are also lost.

# System standalone service template
service my-connector --template check_command=check-connector __HOST='127.0.0.1' __PORT='5700' __TIMEOUT='30'

# Host template with explicit port override AND extra custom var
host mydevice --template
  service CONNECTOR:my-connector __PORT='5800' __LABEL='primary'

# Child host template that inherits without override
host mydevice-v2:mydevice --template

# User reopens standalone to change default host
service my-connector --template __HOST='172.17.0.1'

# Concrete hosts
host device01:mydevice --address=10.0.0.1
host device02:mydevice-v2 --address=10.0.0.2
